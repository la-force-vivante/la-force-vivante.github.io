name: Build and deploy site

# Type-checks the TypeScript, compiles css/style.scss and bundles ts/ into
# js/forum.js, then publishes the whole repo to GitHub Pages.
# The compiled files are NOT committed: they only exist in the deployed site.
# Requires: Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only one deployment at a time; don't cancel one that's already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install build tools
        run: npm ci

      # On pull requests this is the whole job: it fails on type errors
      # or SCSS that doesn't compile.
      - name: Build (type-check, compile SCSS, bundle JS)
        run: npm run build

      - name: Remove build tools before publishing
        if: github.event_name != 'pull_request'
        run: rm -rf node_modules

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5